name: E2E

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  playwright:
    name: Build, unit tests and official-print E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "8080"
      CI: "true"
      E2E_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
      E2E_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
      E2E_CERTIFICATE_SERIAL: ${{ secrets.E2E_CERTIFICATE_SERIAL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --port 8080 --host 127.0.0.1 &
          echo $! > .preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "Preview ready"; exit 0
            fi
            sleep 1
          done
          echo "Preview failed to start"; exit 1

      - name: Run official-print E2E (requires configured staging secrets)
        if: ${{ env.E2E_SUPABASE_STORAGE_KEY != '' && env.E2E_SUPABASE_SESSION_JSON != '' && env.E2E_CERTIFICATE_SERIAL != '' }}
        run: npm run test:e2e

      - name: Report E2E skipped when staging credentials are absent
        if: ${{ env.E2E_SUPABASE_STORAGE_KEY == '' || env.E2E_SUPABASE_SESSION_JSON == '' || env.E2E_CERTIFICATE_SERIAL == '' }}
        run: echo "Official-print E2E skipped: configure E2E_SUPABASE_STORAGE_KEY, E2E_SUPABASE_SESSION_JSON and E2E_CERTIFICATE_SERIAL GitHub Actions secrets."

      - name: Stop preview server
        if: always()
        run: |
          if [ -f .preview.pid ]; then kill "$(cat .preview.pid)" || true; fi

      - name: Upload PDF + screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: /tmp/browser/certigo-pdf
          if-no-files-found: ignore
